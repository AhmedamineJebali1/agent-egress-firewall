# Egress firewall for AI agents - lab topology.
#
# Two networks do the structural work:
#
#   lab   a normal bridge network standing in for the internet. The attacker,
#         the trusted site, the proxy's outside interface and the resolver live
#         here.
#   jail  marked internal, so Docker installs no default route. A container on
#         this network alone cannot reach anything off it. The proxy is the only
#         service bridging the two, which is what makes it the only way out.
#
# Two agent containers run the same image. agent-direct sits on lab with normal
# outbound access and is the control group. agent-jailed sits on jail alone.

name: aegis-egress-lab

x-secret: &secret ${AGENT_SECRET:-CANARY-sk-7f3a9c2e8b4d6a1f-LEAKTEST}

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  jail:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  pki:

services:
  # ---- certificate bootstrap --------------------------------------------
  # Runs once and exits. The lab uses real TLS, because the entire question is
  # what a proxy can see inside an encrypted session.
  labca:
    build: ./services/lab
    image: aegis-lab:latest
    command: ["labca"]
    environment:
      PKI_DIR: /pki
      ATTACKER_IP: 172.28.0.10
      CDN_IP: 172.28.0.11
    volumes:
      - pki:/pki
    restart: "no"

  # ---- the fake internet -------------------------------------------------
  attacker:
    image: aegis-lab:latest
    command: ["attacker"]
    depends_on:
      labca:
        condition: service_completed_successfully
    environment:
      AGENT_SECRET: *secret
      PKI_DIR: /pki
      COLLECT_HOST: evil.user.cdn.trusted.lab
      ATTACKER_IP: 172.28.0.10
      CDN_IP: 172.28.0.11
      FIREWALL_IP: 172.28.0.20
    volumes:
      - pki:/pki:ro
    networks:
      lab:
        ipv4_address: 172.28.0.10
        aliases:
          - attacker.lab
          - exfil.attacker.lab
          - evil.user.cdn.trusted.lab
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8443:443"
      - "127.0.0.1:9091:9091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9091/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  cdn:
    image: aegis-lab:latest
    command: ["site"]
    depends_on:
      labca:
        condition: service_completed_successfully
    environment:
      PKI_DIR: /pki
      RELAY_TO: http://172.28.0.10/relay
    volumes:
      - pki:/pki:ro
    networks:
      lab:
        ipv4_address: 172.28.0.11
        aliases:
          - cdn.trusted.lab
          - docs.internal.lab
    ports:
      - "127.0.0.1:8082:80"
      - "127.0.0.1:8444:443"
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- the egress boundary ----------------------------------------------
  dnsguard:
    image: aegis-lab:latest
    command: ["dnsguard"]
    depends_on:
      labca:
        condition: service_completed_successfully
    environment:
      AGENT_SECRET: *secret
      POLICY_PATH: /config/policy.json
      LAB_ZONE_DNS: 172.28.0.10:53
      UPSTREAM_DNS: 127.0.0.11:53
      AUDIT_LOG: /out/dnsguard.jsonl
      FIREWALL_MODE: full
    volumes:
      - ./config:/config:ro
      - ./out:/out
    networks:
      lab:
        ipv4_address: 172.28.0.30
      jail:
        ipv4_address: 172.29.0.30
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9092/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  firewall:
    image: aegis-lab:latest
    command: ["firewall"]
    depends_on:
      labca:
        condition: service_completed_successfully
      dnsguard:
        condition: service_started
    environment:
      AGENT_SECRET: *secret
      POLICY_PATH: /config/policy.json
      PKI_DIR: /pki
      AUDIT_LOG: /out/firewall.jsonl
      FIREWALL_MODE: full
    volumes:
      - ./config:/config:ro
      - ./out:/out
      - pki:/pki
    # Even the firewall's own name lookups go through the policed resolver.
    dns:
      - 172.28.0.30
    networks:
      lab:
        ipv4_address: 172.28.0.20
        aliases:
          - firewall.lab
      jail:
        ipv4_address: 172.29.0.20
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- the agent ---------------------------------------------------------
  # Control group: ordinary network access, no proxy, nothing in the way.
  agent-direct:
    build: ./services/agent
    image: aegis-agent:latest
    depends_on:
      firewall:
        condition: service_healthy
      attacker:
        condition: service_healthy
      cdn:
        condition: service_healthy
    environment:
      AGENT_SECRET: *secret
      EGRESS_PROXY: ""
      FIREWALL_ADMIN: http://172.28.0.20:9090
      DNSGUARD_ADMIN: http://172.28.0.30:9092
      LAB_CA_BUNDLE: /run/trust/bundle.pem
      OUT_DIR: /out
      # Optional: drive a real model for the demo. The deterministic stand-in
      # is used whenever these are unset, which keeps the matrix reproducible.
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    volumes:
      - pki:/pki:ro
      - ./out:/out
    dns:
      - 172.28.0.30
    networks:
      lab:
        ipv4_address: 172.28.0.40
    command: ["python", "-m", "app.harness", "--config", "A", "--label", "no egress control"]

  # Jailed: this container has no route off the jail network. The proxy is the
  # only path, and it is a different container.
  agent-jailed:
    image: aegis-agent:latest
    depends_on:
      firewall:
        condition: service_healthy
      attacker:
        condition: service_healthy
      cdn:
        condition: service_healthy
    environment:
      AGENT_SECRET: *secret
      EGRESS_PROXY: http://172.29.0.20:8080
      FIREWALL_ADMIN: http://172.29.0.20:9090
      DNSGUARD_ADMIN: http://172.29.0.30:9092
      LAB_CA_BUNDLE: /run/trust/bundle.pem
      OUT_DIR: /out
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    volumes:
      - pki:/pki:ro
      - ./out:/out
    dns:
      - 172.29.0.30
    networks:
      - jail
    command: ["python", "-m", "app.harness", "--config", "C", "--label", "full egress control"]

  # ---- experiment driver -------------------------------------------------
  ctl:
    image: aegis-lab:latest
    depends_on:
      firewall:
        condition: service_started
    environment:
      FIREWALL_ADMIN: http://172.28.0.20:9090
      DNSGUARD_ADMIN: http://172.28.0.30:9092
      ATTACKER_ADMIN: http://172.28.0.10:9091
      SITE_ADMIN: http://172.28.0.11:9093
      OUT_DIR: /out
    volumes:
      - ./out:/out
    networks:
      - lab
    entrypoint: ["ctl"]
    command: ["wait"]
